const notes=[...document.querySelectorAll('.note')];const words=['A seed!','Roots grow down.','A young plant grows.','Flowers grow into pods. Pods have new seeds!'];function reveal(i){const b=notes[i];if(b.parentElement.classList.contains('revealed'))return;b.parentElement.classList.add('revealed');b.setAttribute('aria-expanded','true');b.tabIndex=-1;document.getElementById('feedback').textContent=words[i];const next=notes.find(n=>!n.parentElement.classList.contains('revealed'));(next||document.getElementById('reset')).focus({preventScroll:true});}notes.forEach((b,i)=>b.addEventListener('click',()=>reveal(i)));document.getElementById('reset').onclick=()=>{notes.forEach(b=>{b.parentElement.classList.remove('revealed');b.setAttribute('aria-expanded','false');b.tabIndex=0});document.getElementById('feedback').textContent='I see… · I think… · I wonder…';};document.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key))reveal(Number(e.key)-1)});document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){document.getElementById('feedback').textContent='Use your browser full-screen button.'}};
