<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rex English Lab</title><style>
:root{--n:#173a60;--g:#4f7c57;--bg:#f5f7f6;--b:#d9e3e8;--blue:#eaf3fb;--green:#edf7ee;--cream:#fff8e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203244;font-family:Arial,Trebuchet MS,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:1050px;margin:auto;padding:14px}.hero,.panel,.card{background:#fff;border:1px solid var(--b);border-radius:22px;box-shadow:0 7px 20px #173a6015}.hero{padding:20px;display:flex;justify-content:space-between;gap:14px;align-items:center}.hero h1{margin:0;color:var(--n);font-size:clamp(30px,5vw,50px)}.hero p{color:#607284;margin:8px 0 0}.rex{font-size:78px}.skills,.games{display:grid;gap:10px;margin:12px 0}.skills{grid-template-columns:repeat(4,1fr)}.skill{text-align:center;background:#fff;border:1px solid var(--b);border-radius:15px;padding:10px;font-weight:900;color:var(--n)}.skill span{display:block;font-size:27px}.supports{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--b);padding:10px;border-radius:16px}.supports button,.back,.listen,.primary,.secondary{min-height:44px;border-radius:13px;font-weight:900;padding:9px 13px}.supports button,.back,.secondary{border:1px solid #b7c7d1;background:#fff;color:var(--n)}.games{grid-template-columns:repeat(2,1fr)}.card{border:1px solid var(--b);padding:15px;text-align:left;min-height:145px}.card h2{margin:0;color:var(--n)}.card p{color:#617283}.tag{display:inline-block;background:var(--green);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;color:#35633e}.panel{display:none;margin-top:14px;padding:16px}.panel.on{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.stars{font-weight:900;color:#9a6500}.bar{height:11px;background:#edf1f3;border-radius:999px;overflow:hidden;margin:12px 0 16px}.bar div{height:100%;background:var(--g);width:0}.instruction{display:flex;gap:10px;align-items:center;background:var(--blue);padding:13px;border-radius:17px}.instruction .icon{font-size:34px}.instruction h3{margin:0;color:var(--n)}.instruction p{margin:2px 0;color:#476176}.listen{margin-left:auto;border:0;background:var(--n);color:#fff}.prompt{text-align:center;padding:12px}.big{font-size:clamp(27px,5vw,43px);font-weight:900;color:var(--n)}.pic{font-size:clamp(68px,12vw,112px)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.choice{min-height:105px;border:2px solid var(--b);border-radius:17px;background:#fff;color:var(--n);font-size:20px;font-weight:900;padding:10px}.choice .e{font-size:42px;display:block}.choice.ok{background:#eff9f2;border-color:#68a87b}.choice.no{background:#fff0f0;border-color:#d58f8f}.feedback{display:none;margin-top:11px;padding:11px;border-radius:13px;font-weight:900}.feedback.show{display:block}.feedback.ok{background:#eff9f2;color:#245d37}.feedback.try{background:#fff7e7;color:#745300}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:13px}.primary{border:0;background:var(--n);color:#fff}.primary:disabled{opacity:.45}.tiles,.line{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;border-radius:15px;min-height:60px}.tiles{background:#f6f8f9;border:1px dashed #aebfc9}.line{background:var(--cream);border:2px dashed #d7bf83;margin-bottom:10px}.tile{border:1px solid #b6c7d2;background:#fff;color:var(--n);font-weight:900;border-radius:12px;padding:10px 12px}.tile.used{opacity:.25;pointer-events:none}.type{text-align:center;margin-top:11px}.type input{width:min(600px,100%);padding:12px;border:2px solid #b7c7d1;border-radius:13px}.speakbox{text-align:center;background:var(--cream);border:1px solid #ead7a9;border-radius:18px;padding:16px}.model{font-size:clamp(25px,4vw,38px);font-weight:900;color:var(--n);margin:10px}.result{text-align:center;padding:20px}.result .t{font-size:80px}.topics{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.topics span{background:#f0f3f4;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.easy .type{display:none}.large{font-size:19px}.large .choice{font-size:23px}.smallnote{text-align:center;color:#697b89;font-size:13px}.focus{outline:4px solid #ffd75e;outline-offset:2px}@media(max-width:700px){.rex{display:none}.skills{grid-template-columns:repeat(2,1fr)}.games,.choices{grid-template-columns:1fr}.instruction{flex-wrap:wrap}.listen{margin-left:0}}
</style></head><body class="easy"><main class="app"><section id="home"><div class="hero"><div><h1>Rex English Lab 🦖</h1><p>Family • Class Rules • Pronouns • Possessive Adjectives • Numbers 1–20 • Classroom Actions • <b>We are = We’re</b></p></div><div class="rex">🦖</div></div><div class="skills"><div class="skill"><span>📖</span>READING</div><div class="skill"><span>👂</span>LISTENING</div><div class="skill"><span>🗣️</span>SPEAKING</div><div class="skill"><span>✏️</span>WRITING</div></div><div class="supports"><b>Supports:</b><button id="easy" aria-pressed="true">🧩 Easy mode ON</button><button id="large">🔎 Bigger text</button><button id="readHome">🔊 Read topics</button></div><div class="games"><button class="card" data-game="reading"><h2>📖 Picture Reader</h2><p>Read a word or sentence. Touch the matching pictogram.</p><span class="tag">Reading • 6 rounds</span></button><button class="card" data-game="listening"><h2>👂 Listen & Touch</h2><p>Hear Rex. Choose the picture or word. Replay anytime.</p><span class="tag">Listening • 6 rounds</span></button><button class="card" data-game="speaking"><h2>🗣️ Say It with Rex</h2><p>Listen, repeat, and answer with I am / He is / We’re.</p><span class="tag">Speaking • 6 rounds</span></button><button class="card" data-game="writing"><h2>✏️ Build the Sentence</h2><p>Tap word cards in order. Typing is an extra challenge.</p><span class="tag">Writing • 6 rounds</span></button><button class="card" data-game="weare"><h2>👫 WE ARE = WE’RE</h2><p>Practice first person plural with pictures, audio and sentences.</p><span class="tag">Special focus • 5 rounds</span></button><button class="card" data-game="mix"><h2>⭐ Rex 4-Skills Challenge</h2><p>All four skills together. No timer and no lost lives.</p><span class="tag">Mixed • 10 rounds</span></button></div><p class="smallnote">Easy mode keeps pictograms and word banks visible. Children can repeat audio and retry without losing points.</p></section><section id="panel" class="panel" aria-live="polite"><div class="top"><button class="back" id="back">← Home</button><div class="stars" id="stars">⭐ 0</div></div><div class="bar"><div id="bar"></div></div><div id="area"></div></section></main><script>
(function(){var D=document,Q=function(s){return D.querySelector(s)},home=Q('#home'),panel=Q('#panel'),area=Q('#area'),stars=Q('#stars'),bar=Q('#bar'),state={};function say(t,r){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||.82;speechSynthesis.speak(u)}function sh(a){return a.slice().sort(function(){return Math.random()-.5})}function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c})}var family=[['mom','👩'],['dad','👨'],['brother','👦'],['sister','👧'],['grandma','👵'],['grandpa','👴']],rules=[['Be kind','💛'],['Listen','👂'],['Raise your hand','🙋'],['Do your best','⭐']],pro=[['I','🙋'],['you','👉'],['he','👦'],['she','👧'],['we','👫'],['they','👥']],poss=[['my','🙋✏️'],['your','👉📘'],['his','👦🎒'],['her','👧📏'],['our','👫🏫'],['their','👥🧸']],actions=[['writing','✍️'],['reading','📖'],['drawing','🎨'],['cutting','✂️'],['gluing','🧴'],['listening','👂'],['counting','🔢'],['coloring','🖍️']];function opts(arr,c){var x=sh(arr.filter(function(v){return v[0]!=c[0]})).slice(0,3);return sh([c].concat(x))}function choice(skill,ins,voice,prompt,c,choices,spoken){return{skill:skill,ins:ins,voice:voice,prompt:prompt,c:c,choices:choices,spoken:spoken}}function readQs(){return sh([choice('reading','Read the word. Touch the picture.','Read the word and touch the picture.','mom',family[0],opts(family,family[0])),choice('reading','Read the sentence. Who is it?','Read the sentence. Who is it?','She is my sister.',family[3],opts(family,family[3])),choice('reading','Read the pronoun. Choose the pictogram.','Choose the picture for we.','we',pro[4],opts(pro,pro[4])),choice('reading','Read the phrase. Choose the picture.','Read the phrase and choose.','her ruler',poss[3],opts(poss,poss[3])),choice('reading','Read the action. Touch the picture.','Read the action and touch.','cutting',actions[3],opts(actions,actions[3])),choice('reading','Read the rule. Touch the picture.','Read the class rule and touch.','Raise your hand',rules[2],opts(rules,rules[2]))])}function listenQs(){return sh([choice('listening','Press the speaker. Listen. Touch the answer.','Listen and touch the answer.','🔊 Listen!',family[1],opts(family,family[1]),'Dad'),choice('listening','Listen to the class rule.','Listen and choose.','🔊 Listen!',rules[0],opts(rules,rules[0]),'Be kind'),choice('listening','Listen to the pronoun.','Listen and choose.','🔊 Listen!',pro[3],opts(pro,pro[3]),'She'),choice('listening','Listen to the possessive adjective.','Listen and choose.','🔊 Listen!',poss[2],opts(poss,poss[2]),'His backpack'),choice('listening','Listen to the number.','Listen and choose.','🔊 Listen!',['17','🔢'],sh([['17','1️⃣7️⃣'],['7','7️⃣'],['12','1️⃣2️⃣'],['20','2️⃣0️⃣']]),'Seventeen'),choice('listening','Listen to the action sentence.','Listen and choose.','🔊 Listen!',['We are reading.','👫📖'],sh([['We are reading.','👫📖'],['We are drawing.','👫🎨'],['They are reading.','👥📖'],['I am reading.','🙋📖']]),'We are reading')])}function speakQs(){return[{skill:'speaking',ins:'Listen. Look. Say the sentence.',voice:'Listen and say.',pic:'👩',ans:'She is my mom.'},{skill:'speaking',ins:'Listen. Look. Say the sentence.',voice:'Listen and say.',pic:'👦🎒',ans:'This is his backpack.'},{skill:'speaking',ins:'Answer: What are you doing?',voice:'What are you doing?',pic:'✍️',ans:'I am writing.'},{skill:'speaking',ins:'Answer: What are you doing?',voice:'What are you doing?',pic:'🎨',ans:'I am drawing.'},{skill:'speaking',ins:'Say it with WE.',voice:'Say it with we.',pic:'👫📖',ans:'We are reading.'},{skill:'speaking',ins:'Say the short form.',voice:'Say the short form.',pic:'👫',ans:"We're classmates."}]}function writeQs(){return[[['She','is','my','mom.'],'👩'],[['He','is','my','dad.'],'👨'],[['This','is','her','ruler.'],'👧📏'],[['I','am','drawing.'],'🎨'],[['We','are','reading.'],'👫📖'],[["We're",'classmates.'],'👫']].map(function(x){return{skill:'writing',ins:'Tap the words in the correct order.',voice:'Build the sentence.',words:x[0],pic:x[1],ans:x[0].join(' ')}})}function weQs(){return[choice('reading','Read. Which picture shows WE?','Which picture shows we?','WE = me + other people',['we','👫'],sh([['I','🙋'],['he','👦'],['we','👫'],['they','👥']])),choice('listening','Listen. Choose what you hear.','Listen and choose.','🔊 Listen!',["We're reading.",'👫📖'],sh([["We're reading.",'👫📖'],["We're drawing.",'👫🎨'],['I am reading.','🙋📖'],['They are reading.','👥📖']]),"We're reading."),{skill:'speaking',ins:'Listen and repeat both forms.',voice:'We are classmates. We are classmates short form.',pic:'👫',ans:"We are classmates. We're classmates."},{skill:'writing',ins:'Build the short form.',voice:'Build the short form.',words:['We','are','=','We’re'],pic:'👫',ans:'We are = We’re'},choice('reading','Choose the sentence that means the same.','Choose the same meaning.','We are drawing.',["We're drawing.",'👫🎨'],sh([["We're drawing.",'👫🎨'],['They are drawing.','👥🎨'],['I am drawing.','🙋🎨'],['She is drawing.','👧🎨']]))]}function mixQs(){return sh(readQs().slice(0,2).concat(listenQs().slice(0,2),speakQs().slice(0,2),writeQs().slice(0,2),weQs().slice(0,2))).slice(0,10)}var makers={reading:readQs,listening:listenQs,speaking:speakQs,writing:writeQs,weare:weQs,mix:mixQs},info={reading:['📖','READING'],listening:['👂','LISTENING'],speaking:['🗣️','SPEAKING'],writing:['✏️','WRITING']};function start(g){state={g:g,i:0,score:0,qs:makers[g](),done:false};home.style.display='none';panel.classList.add('on');top();render();panel.scrollIntoView()}function top(){stars.textContent='⭐ '+state.score;bar.style.width=(state.i/state.qs.length*100)+'%'}function head(q){var x=info[q.skill];return'<div class="instruction"><div class="icon">'+x[0]+'</div><div><h3>'+x[1]+'</h3><p>'+esc(q.ins)+'</p></div><button class="listen" id="ri">🔊 Read to me</button></div>'}function fb(t,ok){var f=Q('#fb');f.className='feedback show '+(ok?'ok':'try');f.textContent=t}function reward(){if(!state.done){state.score++;state.done=true;top()}}function next(){state.i++;state.done=false;top();if(state.i>=state.qs.length)finish();else render()}function renderChoice(q){var html=head(q)+'<div class="prompt"><div class="big">'+esc(q.prompt)+'</div></div><div class="choices">';q.choices.forEach(function(c,k){html+='<button class="choice" data-k="'+k+'"><span class="e">'+c[1]+'</span>'+esc(c[0])+'</button>'});html+='</div><div id="fb" class="feedback"></div><div class="actions"><button class="primary" id="next" disabled>Next →</button></div>';area.innerHTML=html;Q('#ri').onclick=function(){say(q.voice)};if(q.spoken)setTimeout(function(){say(q.spoken)},200);D.querySelectorAll('.choice').forEach(function(b){b.onclick=function(){var c=q.choices[+b.dataset.k];if(c[0]===q.c[0]){b.classList.add('ok');reward();fb('⭐ Great job!',true);Q('#next').disabled=false;say('Great job')}else{b.classList.add('no');fb('Try again. No points are lost.',false);say('Try again')}}});Q('#next').onclick=next}function renderSpeak(q){var R=window.SpeechRecognition||window.webkitSpeechRecognition;area.innerHTML=head(q)+'<div class="speakbox"><div class="pic">'+q.pic+'</div><button class="secondary" id="model">🔊 Hear the model</button><div class="model">'+esc(q.ans)+'</div><div class="actions"><button class="primary" id="mic">🎤 Try microphone</button><button class="secondary" id="said">🗣️ I said it!</button></div><p id="ms">Listen, then repeat slowly.</p></div><div id="fb" class="feedback"></div><div class="actions"><button class="primary" id="next" disabled>Next →</button></div>';Q('#ri').onclick=function(){say(q.voice)};Q('#model').onclick=function(){say(q.ans)};Q('#said').onclick=function(){reward();fb('⭐ Nice speaking! Practice is the goal.',true);Q('#next').disabled=false};if(!R){Q('#mic').disabled=true;Q('#mic').textContent='🎤 Mic not available'}else Q('#mic').onclick=function(){try{var r=new R();r.lang='en-US';Q('#ms').textContent='Listening…';r.onresult=function(e){Q('#ms').textContent='I heard: “'+e.results[0][0].transcript+'”';reward();fb('⭐ Great speaking!',true);Q('#next').disabled=false};r.onerror=function(){Q('#ms').textContent='Use “I said it!” and keep practicing.'};r.start()}catch(e){Q('#ms').textContent='Use “I said it!” and keep practicing.'}};Q('#next').onclick=next}function renderWrite(q){var pool=sh(q.words.map(function(w,i){return{w:w,id:i}})),built=[];area.innerHTML=head(q)+'<div class="prompt"><div class="pic">'+q.pic+'</div></div><div class="line" id="line"></div><div class="tiles" id="tiles"></div><div class="type"><b>Extra challenge:</b><br><input id="type" placeholder="Type the sentence"></div><div id="fb" class="feedback"></div><div class="actions"><button class="secondary" id="undo">↶ Undo</button><button class="secondary" id="hint">💡 Hint</button><button class="primary" id="check">Check ✓</button><button class="primary" id="next" disabled>Next →</button></div>';Q('#ri').onclick=function(){say(q.voice)};pool.forEach(function(x,k){var b=D.createElement('button');b.className='tile';b.textContent=x.w;b.dataset.k=k;b.onclick=function(){built.push(x);b.classList.add('used');draw()};Q('#tiles').appendChild(b)});function draw(){Q('#line').innerHTML='';built.forEach(function(x){var s=D.createElement('span');s.className='tile';s.textContent=x.w;Q('#line').appendChild(s)})}Q('#undo').onclick=function(){var x=built.pop();if(x){var k=pool.indexOf(x);D.querySelector('.tile[data-k="'+k+'"]').classList.remove('used');draw()}};Q('#hint').onclick=function(){fb('Hint: '+q.ans,false);say(q.ans)};Q('#check').onclick=function(){var t=built.map(function(x){return x.w}).join(' '),typed=Q('#type').value.trim();if(t===q.ans||typed.toLowerCase()===q.ans.toLowerCase()){reward();fb('⭐ Perfect!',true);Q('#next').disabled=false;say(q.ans)}else fb('Almost! Use the hint and try again.',false)};Q('#next').onclick=next}function render(){var q=state.qs[state.i];top();if(q.skill==='speaking')renderSpeak(q);else if(q.skill==='writing')renderWrite(q);else renderChoice(q)}function finish(){bar.style.width='100%';area.innerHTML='<div class="result"><div class="t">🏆🦖</div><h2>You did it!</h2><p>You practiced <b>Reading, Listening, Speaking and Writing</b>.</p><p class="stars">⭐ '+state.score+' / '+state.qs.length+'</p><div class="topics"><span>family</span><span>class rules</span><span>pronouns</span><span>possessive adjectives</span><span>numbers 1–20</span><span>-ing actions</span><span>we are = we’re</span></div><div class="actions"><button class="primary" id="again">Play again</button><button class="secondary" id="home2">Choose another game</button></div></div>';say('Great job. You practiced English.');Q('#again').onclick=function(){start(state.g)};Q('#home2').onclick=goHome}function goHome(){panel.classList.remove('on');home.style.display='block';area.innerHTML='';window.scrollTo(0,0)}D.querySelectorAll('[data-game]').forEach(function(b){b.onclick=function(){start(b.dataset.game)}});Q('#back').onclick=goHome;Q('#readHome').onclick=function(){say('Rex English Lab. Practice reading, listening, speaking and writing. Family, class rules, pronouns, possessive adjectives, numbers one to twenty, classroom actions, and we are equals we are short form.')};Q('#easy').onclick=function(){D.body.classList.toggle('easy');var on=D.body.classList.contains('easy');this.setAttribute('aria-pressed',on);this.textContent=on?'🧩 Easy mode ON':'🧩 Easy mode OFF'};Q('#large').onclick=function(){D.body.classList.toggle('large')}})();
</script></body></html>
