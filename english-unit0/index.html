<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rex English Lab</title>
<style>
:root{--navy:#234d70;--green:#668d69;--bg:#f3f7f8;--line:#d8e4e9;--blue:#eef6fb;--cream:#fff8eb;--pink:#fff1f5}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#243746}button{font:inherit}
.app{max-width:1080px;margin:auto;padding:14px}.hero,.card,.screen{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:0 9px 24px #234d7014}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:center;padding:20px}.hero h1{margin:0;color:var(--navy);font-size:clamp(30px,5vw,48px)}.hero p{color:#617886;line-height:1.45}.hero img{width:100%;max-height:230px;object-fit:contain;border-radius:20px}
.controls,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:800;cursor:pointer;min-height:44px}.primary{background:var(--navy);color:white}.secondary{background:white;color:var(--navy);border:1px solid #b8cad4}.good{background:var(--green);color:white}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.skill{background:white;border:1px solid var(--line);border-radius:16px;padding:11px;text-align:center;color:var(--navy);font-weight:900}.skill span{display:block;font-size:27px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:16px;text-align:left;cursor:pointer}.card h2{margin:0 0 7px;color:var(--navy)}.card p{margin:0;color:#607584;line-height:1.35}.tag{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:999px;background:#eef7ef;color:#446c49;font-size:12px;font-weight:800}
.screen{display:none;margin-top:14px;padding:16px}.screen.on{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.stars{font-weight:900;color:#8b6211}.progress{height:12px;background:#edf2f4;border-radius:999px;overflow:hidden;margin:10px 0 14px}.progress div{height:100%;width:0;background:var(--green)}
.instruction{display:flex;align-items:center;gap:11px;background:var(--blue);border-radius:18px;padding:13px;margin-bottom:12px}.instruction .icon{font-size:29px;background:white;border:1px solid #cbdde7;border-radius:50%;width:52px;height:52px;display:grid;place-items:center}.instruction h3{margin:0;color:var(--navy)}.instruction p{margin:3px 0 0;color:#557080}.instruction .btn{margin-left:auto}
.box{background:white;border:1px solid var(--line);border-radius:22px;padding:16px}.prompt{text-align:center;color:var(--navy);font-size:clamp(26px,4vw,38px);font-weight:900;margin:5px 0 12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{border:2px solid var(--line);background:white;border-radius:18px;padding:8px;cursor:pointer;min-height:180px;overflow:hidden}.choice img{width:100%;height:190px;object-fit:contain;border-radius:14px;animation:floaty 2.8s ease-in-out infinite}.choice.ok{border-color:#79af84;background:#eff9f1}.choice.bad{border-color:#d39890;background:#fff2f0}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.choice img{animation:none}}
.scene{display:flex;justify-content:center;align-items:center;min-height:245px;border:1px dashed #d5e2e7;border-radius:20px;background:#f8fbfc;padding:10px}.scene img{max-width:100%;max-height:260px;object-fit:contain;border-radius:16px}
.feedback{display:none;margin-top:11px;padding:11px;border-radius:14px;font-weight:800}.feedback.show{display:block}.feedback.ok{background:#edf8ef;color:#285d37}.feedback.try{background:#fff6e8;color:#8b620e}
.line,.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:70px;border-radius:17px;padding:11px}.line{margin:12px 0;background:var(--cream);border:2px dashed #dcc58b}.bank{background:#f6f9fa;border:1px dashed #b7cad4}.word{border:1px solid #bcced7;background:white;color:var(--navy);border-radius:12px;padding:11px 13px;font-weight:900;cursor:pointer}.word.used{opacity:.25;pointer-events:none}
.actions{justify-content:center;margin-top:12px}.small{color:#687b88;font-size:13px;text-align:center;margin-top:8px}.result{text-align:center;padding:15px}.result img{width:min(300px,100%);border-radius:20px}.result .score{font-size:22px;font-weight:900;color:var(--navy)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.num{min-height:100px;border:2px solid var(--line);border-radius:17px;background:white;color:var(--navy);font-weight:900;font-size:42px;cursor:pointer}.num.ok{background:#eff9f1;border-color:#79af84}.num.bad{background:#fff2f0;border-color:#d39890}
body.large{font-size:19px}body.large .word,body.large .btn{font-size:20px}
@media(max-width:720px){.hero{grid-template-columns:1fr}.skills{grid-template-columns:repeat(2,1fr)}.games,.choices{grid-template-columns:1fr}.nums{grid-template-columns:repeat(2,1fr)}.instruction{flex-wrap:wrap}.instruction .btn{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
<div>
<h1>Rex English Lab 🦖</h1>
<p>Family · Class Rules · Personal Pronouns · Possessive Adjectives · Numbers 1–20 · Classroom Actions · We are / We’re</p>
<div class="controls"><button id="big" class="btn secondary">🔎 Bigger text</button><button id="topics" class="btn primary">🔊 Read topics</button></div>
</div>
<img src="https://freesvg.org/img/Chidren.png" alt="Cartoon children">
</section>
<div class="skills"><div class="skill"><span>📖</span>READING</div><div class="skill"><span>👂</span>LISTENING</div><div class="skill"><span>🗣️</span>SPEAKING</div><div class="skill"><span>✏️</span>WRITING</div></div>
<section class="games">
<button class="card" data-game="reading"><h2>Picture Reader</h2><p>Read and choose the correct cartoon picture.</p><span class="tag">Reading · 7 rounds</span></button>
<button class="card" data-game="listening"><h2>Listen & Touch</h2><p>Listen as many times as needed, then choose.</p><span class="tag">Listening · 7 rounds</span></button>
<button class="card" data-game="speaking"><h2>Say It with Rex</h2><p>Look at the question and picture, then answer aloud. No answer appears on screen.</p><span class="tag">Speaking · 6 rounds</span></button>
<button class="card" data-game="ordering"><h2>Sentence Builder</h2><p>Order lots of sentences using word cards.</p><span class="tag">Writing · 14 rounds</span></button>
<button class="card" data-game="weare"><h2>We are = We’re</h2><p>First person plural with speaking and sentence ordering.</p><span class="tag">Special focus · 6 rounds</span></button>
<button class="card" data-game="mix"><h2>Rex 4-Skills Challenge</h2><p>A mixed review with all four skills.</p><span class="tag">4 skills · 10 rounds</span></button>
</section>
<section id="screen" class="screen">
<div class="top"><button id="home" class="btn secondary">← Home</button><div id="stars" class="stars">⭐ 0</div></div>
<div class="progress"><div id="bar"></div></div><div id="content"></div>
</section>
</div>
<script>
(function(){
const IMG={
mom:"https://freesvg.org/img/1474478625.png",dad:"https://freesvg.org/img/father.png",sister:"https://freesvg.org/img/1403141521.png",brother:"https://freesvg.org/img/Child17.png",grandma:"https://freesvg.org/img/GRANDMOTHER.png",grandpa:"https://freesvg.org/img/1474466250.png",
group:"https://freesvg.org/img/Chidren.png",classroom:"https://freesvg.org/img/GeoGebra-als-interaktives-Tafelbild.png",
reading:"https://freesvg.org/img/munch-student-zazou.png",writing:"https://freesvg.org/img/hardatwork3c45.png",hand:"https://openclipart.org/image/800px/217508",glue:"https://freesvg.org/img/Pegamento-2016-01.png"
};
const family=[["mom",IMG.mom],["dad",IMG.dad],["sister",IMG.sister],["brother",IMG.brother],["grandma",IMG.grandma],["grandpa",IMG.grandpa]];
const actions=[["reading",IMG.reading],["writing",IMG.writing],["gluing",IMG.glue],["listening",IMG.classroom]];
const rules=[["Raise your hand",IMG.hand],["Listen",IMG.classroom],["Be kind",IMG.group],["Do your best",IMG.writing]];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s); let S={};
function say(t,r=.84){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;speechSynthesis.speak(u)}
function sh(a){return a.slice().sort(()=>Math.random()-.5)}
function opts(pool,answer){return sh([answer,...sh(pool.filter(x=>x[0]!==answer[0])).slice(0,3)])}
function qChoice(skill,instruction,prompt,answer,choices,audio){return{skill,instruction,prompt,answer,choices,audio}}
function reading(){return[
qChoice("reading","Read the word. Touch the correct picture.","mom",family[0],opts(family,family[0])),
qChoice("reading","Read the sentence. Touch the correct picture.","She is my sister.",family[2],opts(family,family[2])),
qChoice("reading","Read the word. Touch the correct picture.","grandpa",family[5],opts(family,family[5])),
qChoice("reading","Read the class rule. Touch the correct picture.","Raise your hand",rules[0],opts(rules,rules[0])),
qChoice("reading","Read the action. Touch the correct picture.","reading",actions[0],opts(actions,actions[0])),
qChoice("reading","Read the action. Touch the correct picture.","writing",actions[1],opts(actions,actions[1])),
qChoice("reading","Read the action. Touch the correct picture.","gluing",actions[2],opts(actions,actions[2]))
]}
function listening(){return[
qChoice("listening","Listen. Touch the correct picture.","Listen and choose.",family[1],opts(family,family[1]),"dad"),
qChoice("listening","Listen. Touch the correct picture.","Listen and choose.",family[4],opts(family,family[4]),"grandma"),
qChoice("listening","Listen. Touch the correct picture.","Listen and choose.",rules[0],opts(rules,rules[0]),"raise your hand"),
qChoice("listening","Listen. Touch the correct picture.","Listen and choose.",actions[0],opts(actions,actions[0]),"reading"),
qChoice("listening","Listen. Touch the correct picture.","Listen and choose.",actions[1],opts(actions,actions[1]),"writing"),
qChoice("listening","Listen. Touch the correct picture.","Listen and choose.",actions[2],opts(actions,actions[2]),"gluing"),
{skill:"number",instruction:"Listen to the number. Touch it.",audio:"seventeen",answer:"17",choices:["7","12","17","20"]}
]}
function speaking(){return[
{skill:"speaking",question:"Who is she?",image:IMG.mom},
{skill:"speaking",question:"Who is he?",image:IMG.dad},
{skill:"speaking",question:"What are you doing?",image:IMG.writing},
{skill:"speaking",question:"What are you doing?",image:IMG.reading},
{skill:"speaking",question:"What are we doing?",image:IMG.classroom},
{skill:"speaking",question:"Who are they?",image:IMG.group}
]}
function order(){return[
["She is my mom.",["She","is","my","mom."],IMG.mom,"Start with She"],
["He is my dad.",["He","is","my","dad."],IMG.dad,"Start with He"],
["She is my sister.",["She","is","my","sister."],IMG.sister,"Start with She"],
["He is my brother.",["He","is","my","brother."],IMG.brother,"Start with He"],
["This is her ruler.",["This","is","her","ruler."],IMG.sister,"Use her"],
["This is his backpack.",["This","is","his","backpack."],IMG.brother,"Use his"],
["This is our classroom.",["This","is","our","classroom."],IMG.classroom,"Use our"],
["These are their books.",["These","are","their","books."],IMG.group,"Use their"],
["I am writing.",["I","am","writing."],IMG.writing,"Use I am"],
["I am reading.",["I","am","reading."],IMG.reading,"Use I am"],
["We are reading.",["We","are","reading."],IMG.classroom,"Use We are"],
["They are reading.",["They","are","reading."],IMG.group,"Use They are"],
["Raise your hand.",["Raise","your","hand."],IMG.hand,"Class rule"],
["Do your best.",["Do","your","best."],IMG.writing,"Class rule"]
].map(x=>({skill:"ordering",answer:x[0],words:x[1],image:x[2],hint:x[3]}))}
function weare(){return[
{skill:"speaking",question:"Who are we?",image:IMG.classroom},
{skill:"ordering",answer:"We are classmates.",words:["We","are","classmates."],image:IMG.group,hint:"Use We are"},
{skill:"ordering",answer:"We're classmates.",words:["We're","classmates."],image:IMG.group,hint:"Use the short form"},
{skill:"ordering",answer:"We are reading.",words:["We","are","reading."],image:IMG.reading,hint:"Use We are"},
{skill:"ordering",answer:"We are = We're",words:["We","are","=","We're"],image:IMG.group,hint:"Long form = short form"},
{skill:"speaking",question:"What are we doing?",image:IMG.classroom}
]}
function mix(){return sh([...reading().slice(0,2),...listening().slice(0,2),...speaking().slice(0,2),...order().slice(8,12)]).slice(0,10)}
const makers={reading,listening,speaking,ordering:order,weare,mix};
function start(g){S={game:g,qs:makers[g](),i:0,score:0,awarded:false};$("#screen").classList.add("on");update();render();$("#screen").scrollIntoView({behavior:"smooth"})}
function update(){$("#stars").textContent="⭐ "+S.score;$("#bar").style.width=(S.i/S.qs.length*100)+"%"}
function reward(){if(!S.awarded){S.score++;S.awarded=true;update()}}
function fb(t,ok){let f=$("#fb");f.className="feedback show "+(ok?"ok":"try");f.textContent=t}
function next(){S.i++;S.awarded=false;update();S.i>=S.qs.length?finish():render()}
function head(icon,title,text){return '<div class="instruction"><div class="icon">'+icon+'</div><div><h3>'+title+'</h3><p>'+text+'</p></div><button id="read" class="btn primary">🔊 Read</button></div>'}
function renderChoice(q){
let h=head(q.skill==="reading"?"📖":"👂",q.skill==="reading"?"Reading":"Listening",q.instruction)+'<div class="box"><div class="prompt">'+q.prompt+'</div><div class="choices">';
q.choices.forEach((c,i)=>h+='<button class="choice" data-i="'+i+'"><img src="'+c[1]+'" alt=""></button>');
h+='</div><div id="fb" class="feedback"></div><div class="actions"><button id="next" class="btn good" disabled>Next →</button></div></div>';$("#content").innerHTML=h;
$("#read").onclick=()=>say(q.audio||q.prompt);if(q.skill==="listening")setTimeout(()=>say(q.audio),250);
$$(".choice").forEach((b,i)=>b.onclick=()=>{if(q.choices[i][0]===q.answer[0]){b.classList.add("ok");reward();fb("Great job!",true);$("#next").disabled=false}else{b.classList.add("bad");fb("Try again.",false)}});$("#next").onclick=next
}
function renderNumber(q){
let h=head("👂","Listening",q.instruction)+'<div class="box"><div class="prompt">Listen and choose.</div><div class="nums">';
q.choices.forEach(n=>h+='<button class="num" data-n="'+n+'">'+n+'</button>');h+='</div><div id="fb" class="feedback"></div><div class="actions"><button id="again" class="btn secondary">🔊 Replay</button><button id="next" class="btn good" disabled>Next →</button></div></div>';$("#content").innerHTML=h;let play=()=>say(q.audio);$("#read").onclick=play;$("#again").onclick=play;setTimeout(play,250);
$$(".num").forEach(b=>b.onclick=()=>{if(b.dataset.n===q.answer){b.classList.add("ok");reward();fb("Great listening!",true);$("#next").disabled=false}else{b.classList.add("bad");fb("Listen again.",false)}});$("#next").onclick=next
}
function renderSpeak(q){
$("#content").innerHTML=head("🗣️","Speaking","Look at the question and picture. Answer aloud.")+'<div class="box"><div class="prompt">'+q.question+'</div><div class="scene"><img src="'+q.image+'" alt=""></div><p class="small">No answer is shown. Say it yourself or with your teacher.</p><div id="fb" class="feedback"></div><div class="actions"><button id="hear" class="btn secondary">🔊 Hear question</button><button id="said" class="btn good">🗣️ I said it!</button><button id="next" class="btn primary" disabled>Next →</button></div></div>';
$("#read").onclick=()=>say(q.question);$("#hear").onclick=()=>say(q.question);$("#said").onclick=()=>{reward();fb("Nice speaking!",true);$("#next").disabled=false};$("#next").onclick=next
}
function renderOrder(q){
let pool=sh(q.words.map((w,i)=>({w,id:i}))),built=[];$("#content").innerHTML=head("✏️","Sentence Builder","Look at the picture. Tap the words in the correct order.")+'<div class="box"><div class="scene"><img src="'+q.image+'" alt=""></div><div id="line" class="line"></div><div id="bank" class="bank"></div><div id="fb" class="feedback"></div><div class="actions"><button id="undo" class="btn secondary">↶ Undo</button><button id="hint" class="btn secondary">💡 Hint</button><button id="check" class="btn good">Check ✓</button><button id="next" class="btn primary" disabled>Next →</button></div></div>';
let line=$("#line"),bank=$("#bank");function draw(){line.innerHTML="";built.forEach(x=>{let s=document.createElement("span");s.className="word";s.textContent=x.w;line.appendChild(s)})}
pool.forEach((x,i)=>{let b=document.createElement("button");b.className="word";b.textContent=x.w;b.dataset.i=i;b.onclick=()=>{built.push(x);b.classList.add("used");draw()};bank.appendChild(b)});
$("#read").onclick=()=>say("Build the sentence.");$("#undo").onclick=()=>{let last=built.pop();if(!last)return;let match=[...bank.children].find(el=>el.textContent===last.w&&el.classList.contains("used"));if(match)match.classList.remove("used");draw()};$("#hint").onclick=()=>fb(q.hint,false);$("#check").onclick=()=>{let formed=built.map(x=>x.w).join(" ");if(formed===q.answer){reward();fb("Excellent!",true);$("#next").disabled=false}else fb("Try again. Check the order.",false)};$("#next").onclick=next
}
function render(){let q=S.qs[S.i];update();if(q.skill==="reading"||q.skill==="listening")renderChoice(q);else if(q.skill==="number")renderNumber(q);else if(q.skill==="speaking")renderSpeak(q);else renderOrder(q)}
function finish(){$("#bar").style.width="100%";$("#content").innerHTML='<div class="result"><h2>Great job! 🦖</h2><img src="'+IMG.group+'" alt=""><p class="score">⭐ '+S.score+" / "+S.qs.length+'</p><p>You practiced Reading, Listening, Speaking and Writing.</p><div class="actions"><button id="again2" class="btn good">Play again</button><button id="choose" class="btn secondary">Choose another game</button></div></div>';$("#again2").onclick=()=>start(S.game);$("#choose").onclick=goHome;say("Great job")}
function goHome(){$("#screen").classList.remove("on");$("#content").innerHTML="";window.scrollTo({top:0,behavior:"smooth"})}
$$("[data-game]").forEach(b=>b.onclick=()=>start(b.dataset.game));$("#home").onclick=goHome;$("#big").onclick=()=>document.body.classList.toggle("large");$("#topics").onclick=()=>say("Family, class rules, personal pronouns, possessive adjectives, numbers one to twenty, classroom actions, and we are, we're.")
})();
</script>
</body>
</html>
