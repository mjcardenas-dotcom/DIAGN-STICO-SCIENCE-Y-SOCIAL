<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#113c32">
<title>Animal Detectives | Jardín Alado</title>
<style>
:root{--ink:#123d32;--paper:#f5f2e6;--white:#fffcf3;--orange:#ffbe67;--line:#d6ddd0;--sage:#e1ead6;--muted:#496257}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #a73c1b;outline-offset:4px}button:disabled{cursor:default;opacity:.48}
header{border-bottom:1px solid var(--line)}.bar,main{width:min(1120px,92vw);margin:auto}.bar{height:70px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-family:Georgia,serif;font-size:1.24rem;font-weight:bold}.course,.eyebrow{font-size:.72rem;letter-spacing:.17em;font-weight:800;text-transform:uppercase}
main{margin:32px auto 50px}.cover,.quiz{display:grid;grid-template-columns:1fr 1fr;border-radius:24px;overflow:hidden;min-height:530px;background:var(--white);border:1px solid var(--line)}
.cover-copy,.question,.report{padding:clamp(24px,5vw,62px)}.cover-copy{display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.eyebrow{color:var(--muted)}h1,h2{font-family:Georgia,serif;line-height:1;letter-spacing:-.045em;margin:.2em 0 .35em}h1{font-size:clamp(3.25rem,7.5vw,6.4rem)}h2{font-size:clamp(2rem,4.5vw,3.5rem)}
p{margin:.4em 0 1.2em}.button{border:0;background:var(--orange);border-radius:8px;padding:13px 19px;min-height:46px;font-weight:800}.button:hover{background:#ffcd85}.quiet{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 14px;font-weight:700}.quiet:hover{background:var(--sage)}
.plate{position:relative;background:#163f34;min-height:335px;display:grid;place-items:center;margin:0;overflow:hidden}.plate>svg{width:100%;height:100%;max-height:600px;position:absolute;inset:0}.plate figcaption{position:absolute;bottom:20px;left:22px;right:22px;color:#fff7e5;font-size:.82rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.topics div{border:1px solid var(--line);border-radius:12px;padding:13px 17px;background:var(--white);font-weight:750}.topics small{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.progress{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px;align-items:center;font-weight:750}.stops{display:flex;gap:6px}.stops span{width:22px;height:5px;border-radius:4px;background:#c6d4c4}.stops .done{background:#2b714f}.stops .current{background:#9a4e23}
.question{padding-top:35px;padding-bottom:35px}.prompt{color:var(--muted);margin-bottom:12px}.options{display:grid;gap:8px}.choice{background:#fffdf8;border:1px solid #aabdb0;border-radius:10px;display:flex;align-items:center;text-align:left;gap:12px;padding:10px 13px;min-height:49px;font-weight:750}.choice:hover,.choice[aria-pressed=true]{background:var(--sage);border-color:var(--ink)}.letter{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:50%;background:var(--sage);font-size:.78rem}.choice[aria-pressed=true] .letter{background:var(--ink);color:#fff}
.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:20px}.report{max-width:800px;margin:auto;background:var(--white);border:1px solid var(--line);border-radius:24px}.score{display:inline-block;padding:6px 13px;border-radius:8px;background:var(--sage);font-weight:800}.review{list-style:none;padding:0}.review li{border-top:1px solid var(--line);padding:12px 0}.review p{margin:2px 0;color:var(--muted)}.reflection{background:var(--sage);padding:16px;border-radius:10px}.reflection strong{display:block;margin-bottom:6px}
@media(max-width:720px){.bar{height:58px}main{margin-top:16px}.cover,.quiz{grid-template-columns:1fr;min-height:0}.cover .plate{grid-row:1}.plate{min-height:225px}.cover .plate{min-height:255px}.plate figcaption{bottom:10px}.topics div{padding:9px;font-size:.84rem}.topics small{display:none}}
@media print{header,.actions{display:none}.report{border:none;padding:0}body{background:white}}
</style>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<radialGradient id="glade"><stop stop-color="#396650"/><stop offset="1" stop-color="#12392f"/></radialGradient>
<linearGradient id="wing" x2="1" y2="1"><stop stop-color="#ffcf79"/><stop offset="1" stop-color="#d76e46"/></linearGradient>
<pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#e7efbf" opacity=".18"/></pattern>
<g id="leaf"><path d="M0 0Q-10-78 52-110Q80-41 0 0Z" fill="currentColor"/><path d="M0 0Q24-48 52-106" fill="none" stroke="#d0deb3" opacity=".44" stroke-width="1.6"/></g>
<g id="foliage" style="color:#50785a"><path d="M0 10Q15-95 116-186" fill="none" stroke="#7f9b70" stroke-width="3"/><use href="#leaf" transform="translate(9 -32) rotate(-76) scale(.65)"/><use href="#leaf" transform="translate(28 -72) rotate(38) scale(.70)"/><use href="#leaf" transform="translate(42 -96) rotate(-70) scale(.65)"/><use href="#leaf" transform="translate(69 -130) rotate(38) scale(.56)"/><use href="#leaf" transform="translate(86 -151) rotate(-63) scale(.55)"/><use href="#leaf" transform="translate(108 -177) rotate(17) scale(.6)"/></g>
<g id="butterfly">
<g id="side"><path d="M-3 4C-28-86-122-128-136-82C-149-37-113 5-63 13C-123 18-113 76-67 80C-31 79-12 44-3 4Z" fill="url(#wing)" stroke="#f9d591" stroke-width="3"/><path d="M-8 10Q-77-12-128-82M-8 10Q-88 19-130-44M-8 10Q-52 45-79 70M-8 10Q-36 67-50 72" fill="none" stroke="#9e4c34" stroke-width="2"/><path d="M-128-78Q-122-41-100-27M-99 43Q-87 67-70 67" fill="none" stroke="#fff0bb" stroke-width="5" stroke-dasharray="1 9" stroke-linecap="round"/></g>
<use href="#side" transform="scale(-1 1)"/><path d="M0-14Q-11-40-23-44M0-14Q11-40 23-44" stroke="#fff0ba" stroke-width="2" fill="none"/><ellipse cy="9" rx="6" ry="33" fill="#553529"/><circle cy="-18" r="7" fill="#553529"/></g>
<g id="turtle"><path d="M-76 27l-31 12 24 4M-50 27l-13 33h25l15-31M37 27l8 33h26l-11-29" fill="#92a66b"/><path d="M56 29q18-56 49-42 22 8 14 29l-31 4-12 21Z" fill="#a7ba77"/><circle cx="107" cy="-1" r="3.5" fill="#1c3927"/><path d="M-86 31Q-68-66-5-69Q64-71 82 28Q52 51-86 31Z" fill="#c79e59" stroke="#f3ce87" stroke-width="4"/><path d="m-17-47 31 3 18 28-20 29-32-2-17-28Zm-20 30-36-6m53 34-13 26m45-24 14 24m6-53 33-9M14-44l12-16m-43 13-14-16" fill="none" stroke="#76583b" stroke-width="4"/></g>
<g id="egg"><path d="M-44 10C-44-24-17-67 0-67S44-24 44 10A44 40 0 1 1-44 10Z" fill="#f9e8ba" stroke="#d2ad6d" stroke-width="3"/><path d="m-42 4 18 6 11-15 14 18L15 0l12 9 16-6" fill="none" stroke="#ab794e" stroke-width="3"/></g>
<g id="monkey"><path d="M41 29q78 26 65-32-5-19-20-8" stroke="#9e6548" stroke-width="13" fill="none" stroke-linecap="round"/><ellipse cy="35" rx="56" ry="48" fill="#a46b4a"/><circle cx="-57" cy="-27" r="19" fill="#a46b4a"/><circle cx="57" cy="-27" r="19" fill="#a46b4a"/><circle cy="-28" r="61" fill="#a46b4a"/><path d="M0-47q-47-28-46 18 0 49 46 49t46-49Q47-75 0-47Z" fill="#efc995"/><circle cx="-16" cy="-26" r="4" fill="#26392d"/><circle cx="16" cy="-26" r="4" fill="#26392d"/><path d="M-11-4Q0 6 11-4" fill="none" stroke="#684333" stroke-width="3"/></g>
<g id="fish"><path d="m32 0 43-27v54Z" fill="#85a6ad"/><path d="M-63 0Q-13-50 51 0Q-13 50-63 0Z" fill="#bad4d6"/><circle cx="-36" cy="-4" r="4" fill="#223e37"/><path d="M-23-16q12 16 0 32" stroke="#72999b" stroke-width="3" fill="none"/></g>
<g id="berries"><path d="m0 1-7-33m7 30 24-32" stroke="#b5cb83" stroke-width="4"/><use href="#leaf" transform="translate(-6 -26) rotate(-36) scale(.36)" style="color:#80a96d"/><circle cx="-28" cy="6" r="19" fill="#cf716a"/><circle cx="8" cy="2" r="21" fill="#d87b73"/><circle cx="-6" cy="30" r="21" fill="#ac5360"/></g>
<g id="frame"><rect width="540" height="450" fill="url(#glade)"/><rect width="540" height="450" fill="url(#grain)"/><circle cx="275" cy="214" r="154" fill="none" stroke="#a2b88b" opacity=".37"/><circle cx="275" cy="214" r="171" fill="none" stroke="#a2b88b" opacity=".26" stroke-dasharray="2 7"/><use href="#foliage" transform="translate(-31 456) scale(1.8)"/><use href="#foliage" transform="translate(563 4) rotate(180) scale(1.42)"/><use href="#foliage" transform="translate(531 403) rotate(-52) scale(.85)"/></g>
</defs></svg>
<header><div class="bar"><span class="brand">Jardín Alado</span><span class="course">Science · 3rd A &amp; B</span></div></header>
<main id="app"></main>
<script>
const questions = [
  {topic:"Body clues",art:"turtle",caption:"Turtle • Body structure",prompt:"Which clue shows that a turtle is a vertebrate?",options:["It has a shell.","It has a backbone.","It has four legs."],answer:1,why:"A turtle has a backbone inside its body."},
  {topic:"Body clues",art:"butterfly",caption:"Butterfly • Body structure",prompt:"A butterfly has no backbone. Which group is it in?",options:["Invertebrates","Vertebrates"],answer:0,why:"An invertebrate is an animal without a backbone."},
  {topic:"Animal babies",art:"egg",caption:"Turtle egg • A baby is hatching",prompt:"A baby turtle hatches from an egg. How do we classify the turtle?",options:["Viviparous","Oviparous"],answer:1,why:"Turtles are oviparous. Their babies hatch from eggs."},
  {topic:"Animal babies",art:"monkey",caption:"Monkey • A baby is born alive",prompt:"Which word describes a monkey?",options:["Oviparous","Viviparous"],answer:1,why:"Monkeys are viviparous. Their babies develop inside the mother and are born alive."},
  {topic:"Food clues",art:"food",caption:"Bear’s meal • Berries and fish",prompt:"This bear eats berries and fish. What kind of eater is it?",options:["Carnivore","Herbivore","Omnivore"],answer:2,why:"An omnivore eats both plants and animals. Berries come from plants, and fish are animals."}
];
const app = document.querySelector("#app");
let index = 0;
let answers = [];

function plate(art, caption = ""){
  const drawing = art === "food" ? '<use href="#berries" transform="translate(212 211) scale(1.2)"/><use href="#fish" transform="translate(335 222) scale(1.13)"/>' :
    `<use href="#${art}" transform="translate(275 220) scale(${art === "egg" ? 1.78 : 1.25})"/>`;
  return `<figure class="plate"><svg viewBox="0 0 540 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#frame"/>${drawing}</svg>${caption ? `<figcaption>${caption}</figcaption>` : ""}</figure>`;
}

function focusHeading(){
  app.querySelector("h1, h2").focus({preventScroll:true});
  window.scrollTo(0,0);
}

function cover(){
  app.innerHTML = `<section class="cover">
    <div class="cover-copy"><div class="eyebrow">After the field trip</div><h1 tabindex="-1">Animal<br>Detectives</h1>
    <p>Study the clues. Find out how animals are built, how they are born, and what they eat.</p>
    <button class="button" id="start">Start the quiz →</button></div>
    ${plate("butterfly")}
  </section>
  <div class="topics"><div>Body clues<small>Backbones and animal groups</small></div><div>Animal babies<small>Eggs and live birth</small></div><div>Food clues<small>Plants and animals</small></div></div>`;
  app.querySelector("#start").onclick = () => {
    index = 0;
    answers = [];
    question();
  };
}

function question(){
  const item = questions[index];
  app.innerHTML = `<div class="progress"><span>Question ${index+1} of ${questions.length}</span>
    <div class="stops" aria-hidden="true">${questions.map((_,i)=>`<span class="${i<index?"done":i===index?"current":""}"></span>`).join("")}</div></div>
    <section class="quiz">${plate(item.art,item.caption)}
    <div class="question"><div class="eyebrow">${item.topic}</div>
    <h2 tabindex="-1">${item.prompt}</h2><p class="prompt">Choose one answer.</p>
    <div class="options" role="group" aria-label="Answer choices">
    ${item.options.map((option,i)=>`<button class="choice" aria-pressed="${answers[index]===i}"><span class="letter" aria-hidden="true">${"ABC"[i]}</span>${option}</button>`).join("")}
    </div><div class="actions"><button class="quiet" id="back">← Back</button>
    <button class="button" id="next" ${answers[index]===undefined?"disabled":""}>${index===questions.length-1?"See my report":"Continue →"}</button></div></div></section>`;
  const buttons = [...app.querySelectorAll(".choice")];
  const next = app.querySelector("#next");
  buttons.forEach((button,i)=>button.onclick = () => {
    answers[index] = i;
    buttons.forEach((option,j)=>option.setAttribute("aria-pressed",String(i===j)));
    next.disabled = false;
  });
  next.onclick = () => {
    index++;
    if(index===questions.length) report();
    else question();
  };
  app.querySelector("#back").onclick = () => {
    if (index > 0) {
      index--;
      question();
    } else {
      cover();
      focusHeading();
    }
  };
  focusHeading();
}

function report(){
  const score = questions.filter((item,i)=>item.answer===answers[i]).length;
  app.innerHTML = `<section class="report">
    <h2 tabindex="-1">Detective report</h2><span class="score">${score} / ${questions.length} correct</span>
    <ol class="review">${questions.map((item,i)=>`<li><strong>${i+1}. ${item.prompt}</strong>
      <p>${item.answer===answers[i]?"Correct · ":"Your answer · "}${item.options[answers[i]]}</p>
      ${item.answer===answers[i]?"":`<p>Correct answer · ${item.options[item.answer]}</p>`}<p>${item.why}</p></li>`).join("")}</ol>
    <div class="reflection"><strong>See · Think · Wonder</strong>
    <div>I saw ___ at Jardín Alado.</div><div>I think it is a ___ because ___.</div><div>I wonder ___.</div></div>
    <div class="actions"><button class="quiet" id="restart">Try again</button><button class="button" id="print">Print report</button></div></section>`;
  app.querySelector("#restart").onclick = () => {cover();focusHeading();};
  app.querySelector("#print").onclick = () => window.print();
  focusHeading();
}
cover();
</script>
</body>
</html>
