<script>
const labels=['Seed','Sprout','Plant','Flower','Fruit'];const titles=['Put the pictures in order.','Match each picture to a word.','What does a plant need?'];const help=['Start with the seed. Drag or tap a picture, then its number.','Drag or tap a picture, then its word.','Choose four things. Tap the pictures.'];let pillarPhase=0,pillarDone=false;let game=0,order=[],pool=[],selected=null,needs=new Set(),solved=false,drag=null;
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function art(id){let tile=id<5?[0,1,3,4,5][id]:id;if(id===12)return `<div class="art nutrients" role="img" aria-label="Nutrients in soil"></div>`;return `<div class="art" style="background-position:${tile%4*100/3}% ${Math.floor(tile/4)*50}%" role="img" aria-label="${(id<5?labels[id]:['Water','Sunlight','Air','Candy','Toy car','TV','Nutrients'][id-6])}"></div>`}
function card(id,word=false){return `<div class="card ${selected===id?'selected':''}" tabindex="0" role="button" aria-label="${labels[id]} picture" data-card="${id}">${art(id)}${word?labels[id]:''}</div>`}
function start(g){pillarPhase=0;pillarDone=false;game=g;order=Array(5).fill(null);pool=shuffle([0,1,2,3,4]);selected=null;needs=new Set();solved=false;render()}
function render(){if(game===3){renderPillar();return}document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('active',i===game);b.setAttribute('aria-current',i===game?'page':'false')});let s=`<h2>${titles[game]}</h2><div class="instruction"><button class="secondary" id="listen">🔊 Listen</button><p>${help[game]}</p></div>`;
if(game<2){s+=`<div class="bank" aria-label="Picture bank">${pool.map(i=>card(i)).join('')}</div><div class="slots">${order.map((id,i)=>`<div class="slot" tabindex="0" role="button" data-slot="${i}" aria-label="${game===0?'Step '+(i+1):labels[i]}">${game===0?`<span class="num">${i+1}</span>`:`<span>${labels[i]}</span>`}${id===null?'<span style="font-size:16px;margin-top:14px">Tap here</span>':card(id)}</div>`).join('')}</div>`;if(game===0)s+='<div class="cycle-end">Fruit has seeds. The cycle starts again!</div>'}
else{s+=`<div class="choices">${[7,9,12,6,10,8,11].map(id=>`<button class="card ${needs.has(id)?'selected':''}" data-need="${id}" aria-pressed="${needs.has(id)}">${art(id)}${['Water','Sunlight','Air','Candy','Toy car','TV','Nutrients'][id-6]}</button>`).join('')}</div><div class="meter"><div style="width:${solved?100:0}%"></div></div>`}
s+='<div class="feedback" role="status" id="feedback"></div><div class="controls"><button id="check">Check ✓</button><button class="secondary" id="reset">Play again ↻</button><button class="secondary" id="next">Next game</button></div>';document.getElementById('main').innerHTML=s;
document.getElementById('listen').onclick=()=>say(titles[game]+' '+help[game]);document.getElementById('check').onclick=check;document.getElementById('reset').onclick=()=>start(game);document.getElementById('next').onclick=()=>start((game+1)%4);
document.querySelectorAll('[data-card]').forEach(el=>{el.onpointerdown=e=>begin(e,Number(el.dataset.card));el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(Number(el.dataset.card))}}});document.querySelectorAll('[data-slot]').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-card]'))return;place(Number(el.dataset.slot))};el.onkeydown=e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();place(Number(el.dataset.slot))}}});document.querySelectorAll('[data-need]').forEach(el=>el.onclick=()=>{if(solved)return;let id=Number(el.dataset.need);needs.has(id)?needs.delete(id):needs.add(id);say(el.textContent);render()})}
function select(id){if(solved)return;selected=selected===id?null:id;render()}
function place(i){if(selected===null||solved)return;let id=selected,old=order.indexOf(id),other=order[i];if(old>=0)order[old]=other;else{pool=pool.filter(x=>x!==id);if(other!==null)pool.push(other)}order[i]=id;selected=null;render()}
function begin(e,id){if(solved||e.button>0)return;e.preventDefault();e.stopPropagation();drag={id,x:e.clientX,y:e.clientY,moved:false};window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true});window.addEventListener('pointercancel',cancel,{once:true})}
function move(e){if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8&&!drag.moved){drag.moved=true;let el=document.createElement('div');el.className='card ghost';el.innerHTML=art(drag.id);document.body.append(el)}let el=document.querySelector('.ghost');if(el){el.style.left=e.clientX-65+'px';el.style.top=e.clientY-65+'px'}}
function cancel(){document.querySelector('.ghost')?.remove();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',cancel);drag=null}
function end(e){if(!drag)return;let d=drag,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');cancel();if(d.moved&&target){selected=d.id;place(Number(target.dataset.slot))}else if(!d.moved)select(d.id)}
function feedback(t){document.getElementById('feedback').textContent=t;say(t)}
function check(){if(solved){feedback('Great job! Play again or choose the next game.');return}if(game<2){if(order.includes(null)){feedback('Add all five pictures. You can do it!');return}order.forEach((id,i)=>document.querySelector(`[data-slot="${i}"]`).classList.add(id===i?'good':'bad'));if(order.every((id,i)=>id===i)){solved=true;selected=null;feedback(game===0?'Wonderful! A seed grows into a plant. Flowers become fruits with seeds!':'Great matching! Seed, sprout, plant, flower, fruit.');document.querySelector('.slots').classList.add('celebrate')}else feedback('Almost! Keep the green pictures. Try the orange places again.')}else{if(needs.size===4&&[6,7,8,12].every(id=>needs.has(id))){solved=true;render();feedback('Wonderful! A plant needs water, sunlight, air and nutrients!');document.querySelector('.choices').classList.add('celebrate')}else feedback(needs.size!==4?'Choose four pictures.':'Try again! Does a plant need a toy or food like candy?')}}

function renderPillar(){
 document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('active',i===3);b.setAttribute('aria-current',i===3?'page':'false')});
 let question=pillarPhase===0?'Which pillar helps us care for plants?':'Why is environmental responsibility important?';
 let options=pillarPhase===0?['Family','Environmental Responsibility','Public Speaking']:['Because we pull off the leaves.','Because we care for plants and nature.','Because we waste water.'];
 document.getElementById('main').innerHTML=`<h2>${question}</h2><div class="instruction"><button class="secondary" id="pillarListen">🔊 Listen</button><p>Look, think and choose.</p></div><div class="pillar-scene" role="img" aria-label="Children watering and planting in a garden"></div><div class="pillar-options">${options.map((t,i)=>`<button class="secondary" data-answer="${i}">${t}</button>`).join('')}</div><div class="feedback" id="feedback" role="status"></div><div class="controls"><button class="secondary" id="pillarReset">Play again ↻</button><button id="pillarNext" hidden>${pillarPhase===0?'Why?':'Back to the cycle'}</button></div>`;
 document.getElementById('pillarListen').onclick=()=>say(question+' '+(pillarPhase===0?'Family. Environmental responsibility. Public speaking.':options.join(' ')));
 document.getElementById('pillarReset').onclick=()=>start(3);
 document.getElementById('pillarNext').onclick=()=>{if(pillarPhase===0){pillarPhase=1;pillarDone=false;renderPillar()}else start(0)};
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(pillarDone)return;let i=Number(b.dataset.answer);if(i===1){pillarDone=true;b.style.background='#c9f4d7';b.style.borderColor='#16804c';b.classList.add('celebrate');feedback(pillarPhase===0?'Yes! Environmental responsibility!':'Yes! We care for plants and nature. We use water wisely!');document.getElementById('pillarNext').hidden=false}else{b.style.borderColor='#e88919';feedback('Try again! How can we care for plants?')}});
}
start(0);
</script></html>
